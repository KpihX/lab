[project]
name = "kpihx-lab"
version = "0.2.10"
description = "KpihX scientific and AI exploration environment (rapid scripts, plotting, numerics, hardware-accelerated prototyping)"
requires-python = ">=3.12"

# Base scientific stack. Kept deliberately small: this environment is loaded on
# every exploratory script, so it stays fast to sync and easy to reason about.
# Everything heavier is an optional profile below.
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    # In base so make kernel works on a bare sync.
    "ipykernel",
    "scikit-learn",
    "kagglehub[hf-datasets,pandas-datasets,polars-datasets]",
    "polars",
    "pandas",
    "typer",
    "rich",
    "ipywidgets>=8.1.9",
    "ipython>=9.17.1",
    "ipympl>=0.10.0",
]

# ---------------------------------------------------------------------------
# Optional profiles: hardware axes and domain axes are separate on purpose
# ---------------------------------------------------------------------------
# Hardware profiles are mutually exclusive: a machine gets exactly one torch
# backend. Domain profiles stack freely on top.
#
# Usage: bare sync = base only, plus exactly one hardware backend.
#   uv sync                          base numerics only
#   uv sync --extra cpu              + CPU torch
#   uv sync --extra xpu              + Intel Arc (XPU) torch
#   uv sync --extra cuda             + NVIDIA CUDA torch
[project.optional-dependencies]
cpu = [
    "torch>=2.8",
    "torchvision>=0.23",
]
xpu = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.57",
    "accelerate>=1.10.1",
    "huggingface_hub>=0.34.4",
    "safetensors>=0.6.2",
]
cuda = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.57",
    "accelerate>=1.10.1",
    "huggingface_hub>=0.34.4",
    "safetensors>=0.6.2",
]

[project.scripts]
lab = "lab.cli:app"

[tool.uv]
package = true
# On Intel Arc, this entry makes the XPU wheels rank correctly against PyPI
# during resolution. Removing it is how PyTorch silently resolves to a CUDA
# build and the model ends up on the CPU. Rationale and full doctrine:
# k-ai/references/pyproject-hardware.md, template: AI/nobg/pyproject.toml.
index-strategy = "unsafe-best-match"
# One accelerator backend per environment, never a mixture.
conflicts = [
    [{ extra = "cpu" }, { extra = "xpu" }, { extra = "cuda" }],
]

# ---------------------------------------------------------------------------
# PyTorch indexes
# ---------------------------------------------------------------------------
# Index flags mirror the verified k-nobg template exactly. `explicit = true`
# keeps an index out of general resolution so the base numeric workflow is
# unaffected; the XPU index is left non-explicit on purpose, that combination is
# the one measured working on this machine.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# This binding is what actually selects the accelerator.
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

# ---------------------------------------------------------------------------
# Development
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ISC"]
ignore = [
    "W291",  # Trailing whitespace (ASCII art, multi-line banners in logo.py)
    "W293",  # Blank line contains whitespace
    "E501",  # Line too long
    "UP042", # StrEnum suggestion (keep compatibility with (str, Enum))
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # Re-exports without __all__ per sovereign encapsulation rule
